# Render Blueprint for the backend. Secrets are marked sync:false and entered in the Render dashboard.
services:
  - type: web
    name: mandimitra-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build -w @mandimitra/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_STT_MODEL
        value: prisma-v3.0
      - key: GNANI_TTS_MODEL
        value: timbre-v2.5
      - key: DEMO_MODE_ENABLED
        value: 'true'
