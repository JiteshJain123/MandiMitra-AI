# Local full-stack run:  docker compose up --build   ->  http://localhost:8080
# Put your Gnani key in apps/api/.env (GNANI_API_KEY=...). It is read only by the api container.
services:
  mongo:
    image: mongo:8
    ports: ['27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '4000'
      MONGODB_URI: mongodb://mongo:27017/mandimitra
      CORS_ORIGINS: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789abcdef}
    depends_on:
      mongo: { condition: service_healthy }
    ports: ['4000:4000']

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ['8080:80']

volumes:
  mongo-data:
